<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis TOEFL ITP – 100 Soal dan Pembahasan</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#17203d;--mute:#5d6783;--line:#dde2ee;--accent:#1e3a8a;--accent2:#0f8b8d;--ok:#12805c;--okbg:#e4f6ee;--bad:#b3261e;--badbg:#fdeceb;--warn:#8a5a00;--warnbg:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#171e36;--ink:#e8ecfa;--mute:#9aa5c7;--line:#2a3354;--accent:#8fa8ff;--accent2:#4fd1c5;--ok:#5fe0ae;--okbg:#10352b;--bad:#ff8f87;--badbg:#3a1a1c;--warn:#ffd271;--warnbg:#3a2f12}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(26px,6vw,38px)}
.hero p{color:var(--mute);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.menu label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;cursor:pointer}
.menu label.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.menu input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.menu small{display:block;color:var(--mute)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:600;min-height:48px}
@media(prefers-color-scheme:dark){.btn{color:#0f1426}}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 150px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s}
.tag{display:inline-block;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:6px}
.instr{color:var(--mute);font-size:14px;margin:0 0 10px}
.passage{background:var(--bg);border-left:4px solid var(--accent2);padding:12px 14px;border-radius:6px;margin:10px 0;font-size:15px}
.qtext{white-space:pre-line;font-size:17px;margin:10px 0 14px}
.qtext b.m{color:var(--accent2);font-weight:700}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:9px;min-height:48px}
.choice:not(:disabled):hover{border-color:var(--accent)}
.choice .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.choice.ok{border-color:var(--ok);background:var(--okbg)}.choice.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.bad{border-color:var(--bad);background:var(--badbg)}.choice.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.choice:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:14px}
.script{background:var(--bg);border-left:4px solid var(--accent);padding:12px 14px;border-radius:6px;margin:10px 0;font-size:16px;white-space:pre-line}
.script .slabel{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.score{font-family:Georgia,serif;font-size:64px;color:var(--accent);line-height:1}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right}
.rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-size:15px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="menu" class="menu">
  <div class="hero">
    <h1>Kuis TOEFL ITP</h1>
    <p>100 soal dengan pembahasan berbahasa Indonesia. Semua soal Listening berbentuk teks (transkrip). Skor benar dan salah dihitung otomatis.</p>
  </div>
  <div class="card">
    <h2 style="font-size:20px">Pilih materi</h2>
    <label class="opt"><input type="checkbox" value="L" checked><span><b>Listening Comprehension</b><small>30 soal · Dialog singkat, monolog, diskusi</small></span></label>
    <label class="opt"><input type="checkbox" value="S" checked><span><b>Structure &amp; Written Expression</b><small>40 soal · Error recognition dan sentence completion</small></span></label>
    <label class="opt"><input type="checkbox" value="R" checked><span><b>Reading Comprehension</b><small>30 soal · 3 passage</small></span></label>
    <label class="opt"><input type="checkbox" id="shuf"><span><b>Acak urutan soal</b><small>Soal dikocok setiap kali mulai</small></span></label>
    <div class="row"><button class="btn" id="start">Mulai kuis</button></div>
  </div>
</div>

<div id="quiz" class="hide">
  <div class="bar">
    <div class="stats"><span class="pill" id="sNo">1/100</span><span class="pill ok" id="sOk">Benar 0</span><span class="pill bad" id="sBad">Salah 0</span><span class="pill" id="sLeft">Sisa 0</span></div>
    <div class="prog"><i id="pg"></i></div>
  </div>
  <div class="card" id="qcard"></div>
  <div class="row"><button class="btn alt" id="quit">Keluar ke menu</button><button class="btn" id="next" disabled>Soal berikutnya</button></div>
</div>

<div id="result" class="hide"></div>

</div>

<script>
const D=[];
const q=(s,t,o,a,e)=>D.push({s,t,o,a,e});
const E=(t,a,e)=>q("SA",t,["A","B","C","D"],a,e);

const SEC={
LA:{n:"Listening · Bagian A: Dialog Singkat",g:"L",i:"Audio diganti teks. Baca transkrip dialog di bawah, lalu jawab pertanyaannya."},
LB:{n:"Listening · Bagian B: Monolog Pendek",g:"L",i:"Audio diganti teks. Baca transkrip monolog di bawah, lalu fokus pada gagasan utama dan detail."},
LC:{n:"Listening · Bagian C: Diskusi",g:"L",i:"Audio diganti teks. Baca transkrip diskusi di bawah, lalu perhatikan keputusan akhir yang disepakati."},
SA:{n:"Structure · A: Error Recognition",g:"S",i:"Tandai bagian (A/B/C/D) yang salah. Huruf menandai awal setiap bagian bergaris bawah."},
SB:{n:"Structure · B: Sentence Completion",g:"S",i:"Pilih jawaban terbaik untuk melengkapi kalimat."},
R1:{n:"Reading · Passage 1: Photosynthesis Basics",g:"R",i:"Baca passage lalu jawab pertanyaan.",p:"Photosynthesis is the process by which green plants convert sunlight into chemical energy. It takes place in chloroplasts, where chlorophyll captures light, primarily in the blue and red wavelengths. The absorbed energy drives two main stages: the light-dependent reactions and the Calvin cycle. In the first stage, water molecules are split, producing oxygen and transferring energy to ATP and NADPH, two molecules that carry energy. In the Calvin cycle, the plant uses ATP and NADPH to transform carbon dioxide into glucose. The rate of photosynthesis depends on light intensity, the amount of carbon dioxide, and temperature; at low temperatures the process slows down. Scientists study photosynthesis closely because a better understanding of it helps them develop engineered crops, meaning crops that have been genetically modified, so that plants can adapt better to changing conditions."},
R2:{n:"Reading · Passage 2: Urbanization and Public Health",g:"R",i:"Baca passage lalu jawab pertanyaan.",p:"Urbanization is growing fast and brings serious health problems. In crowded cities, diseases spread more easily, pollution levels rise, and sanitation systems become overburdened, meaning overloaded and unable to handle the number of residents. Poor people in cities are most at risk because they often live in crowded housing with limited services. Governments respond by improving waste management systems, building and upgrading hospitals, and promoting health education, which teaches people how to prevent illness. Cities are also turning to sustainable design, which includes green spaces and public transit. Cleaner cities have fewer respiratory illnesses, and sustainable design lowers disease and improves quality of life. Unplanned urban sprawl, in contrast, makes these problems worse."},
R3:{n:"Reading · Passage 3: Industrial Revolution Overview",g:"R",i:"Baca passage lalu jawab pertanyaan.",p:"The Industrial Revolution changed the way goods were produced. Before factories, goods were handmade by individual workers in homes and small workshops. Inventions such as the steam engine and mechanized looms, which are looms driven by machines, allowed factories to produce far more goods than before. This higher output, however, came with costs: workers faced long hours and unsafe conditions, and pollution spread widely in industrial cities. Reformers pushed for labor laws, and public debate arose over economic growth versus the rights of workers. By the middle of the nineteenth century, the first regulations had been introduced to protect workers."}
};
const GN={L:"Listening Comprehension",S:"Structure & Written Expression",R:"Reading Comprehension"};

/* ---------- LISTENING A ---------- */
q("LA","A: Are you going to the faculty meeting today?\nB: No, it’s been canceled.\nWhat does speaker B say about the meeting?",["It’s on schedule","It’s postponed","It’s canceled","B is attending"],2,"B menyebut meeting “been canceled”, artinya rapat dibatalkan, bukan ditunda.");
q("LA","A: Do you want cream or sugar with your coffee?\nB: Just cream, thanks.\nWhat does speaker B want in the coffee?",["Sugar","Cream","Both","Neither"],1,"B menjawab “Just cream”, jadi ia hanya ingin krim.");
q("LA","A: Where is the student ID office located?\nB: On the first floor of the administration building.\nWhere should they go?",["Library","Administration building","Student center","Cafeteria"],1,"Lokasi disebut jelas: “administration building” lantai satu.");
q("LA","A: How much does this textbook cost?\nB: It’s around $45, but you can get it used for $30.\nWhat’s the price of the used textbook?",["$45","$30","$15","$60"],1,"$45 adalah harga baru. Harga bekas disebut “used for $30”.");
q("LA","A: When is the paper due?\nB: Next Wednesday at noon.\nWhen is the deadline?",["Wednesday morning","Wednesday noon","Tuesday evening","Thursday noon"],1,"Batas waktunya “Wednesday at noon”, yaitu Rabu siang pukul 12.");
q("LA","A: Did you enjoy the concert last night?\nB: Yes, especially the violin solo.\nWhat did speaker B enjoy most?",["The piano solo","The drum performance","The violin solo","The opening group"],2,"B menyebut “especially the violin solo”, yaitu bagian yang paling ia nikmati.");
q("LA","A: Can I borrow your calculator?\nB: Sorry, I need it for my exam.\nWhy can’t speaker B lend the calculator?",["B lost it","B needs it","It’s broken","It belongs to someone else"],1,"B tidak bisa meminjamkan karena ia sendiri membutuhkan kalkulator untuk ujiannya.");
q("LA","A: Are you registering for the seminar?\nB: Yes, but I need to pay the fee first.\nWhat does speaker B need to do before registering?",["Send an email","Find the seminar schedule","Pay the fee","Get approval"],2,"B harus “pay the fee first”, yaitu membayar biaya sebelum mendaftar.");
q("LA","A: Have you finished the reading assignment?\nB: Not yet, I’m halfway through Chapter 4.\nHow far has speaker B read?",["Chapter 2","Chapter 3","Half of Chapter 4","Chapter 5"],2,"“Halfway through Chapter 4” berarti baru membaca separuh Bab 4.");
q("LA","A: Is the chemistry lab available this afternoon?\nB: Yes, it’s free between 2 and 4 PM.\nWhen is the lab available?",["1–2 PM","2–4 PM","3–5 PM","Not available"],1,"B memberi rentang waktu kosong pukul 2 sampai 4 sore.");

/* ---------- LISTENING B ---------- */
q("LB","Today’s lecture covers the water cycle. We’ll look at four stages: evaporation, condensation, precipitation, and collection.\nWhat is the main topic of the lecture?",["Ocean currents","The water cycle","Weather forecasting","River ecosystems"],1,"Topik utama disebut di awal: “the water cycle”. Empat tahap sesudahnya hanyalah rinciannya.");
q("LB","In cell division, mitosis ensures that each daughter cell receives a full set of chromosomes identical to the parent cell.\nWhat process is described?",["Photosynthesis","Mitosis","Meiosis","Respiration"],1,"Kata kunci “mitosis” disebut langsung. Meiosis menghasilkan setengah set kromosom, jadi tidak cocok.");
q("LB","Inflation refers to the rise in prices of goods and services over time. As prices rise, each unit of currency buys less, which reduces purchasing power.\nWhat does inflation reduce?",["Purchasing power","Loan interest","Government spending","Import taxes"],0,"Teks menyatakan inflasi “reduces purchasing power”, yaitu menurunkan daya beli.");
q("LB","The Great Barrier Reef is facing serious threats. Rising ocean temperatures caused by climate change are bleaching the coral, and overfishing is damaging the ecosystem.\nWhich of the following threatens the reef?",["Volcanoes","Desertification","Climate change","Urbanization"],2,"Dua ancaman disebut, yaitu climate change dan overfishing. Hanya climate change yang ada di pilihan.");
q("LB","To make ethical decisions, one must weigh the pros and cons of each choice. Two well-known frameworks are utilitarianism, which focuses on outcomes, and deontology, which focuses on duties.\nWhat is the speaker discussing?",["Ethical decision-making","Financial planning","The scientific method","Communication skills"],0,"Pembicara membahas cara mengambil keputusan etis dan dua kerangka moral (utilitarianism dan deontology).");
q("LB","In Shakespeare’s Hamlet, the prince struggles with revenge and mortality. Throughout the play, it is unclear whether his madness is real or pretended.\nWhich issue about the main character is mentioned?",["Love","Madness","Friendship","Betrayal"],1,"Teks menyebut “his madness”, yaitu kegilaan sang pangeran. Pilihan lain tidak disebut.");
q("LB","A balanced diet includes carbohydrates, proteins, and fats. Carbohydrates provide energy, and proteins build and repair tissues.\nWhich nutrient builds tissues?",["Carbohydrates","Fats","Proteins","Vitamins"],2,"Teks menyatakan langsung bahwa protein membangun dan memperbaiki jaringan tubuh.");
q("LB","Climbing Mount Everest is extremely dangerous. Climbers face altitude sickness, extreme cold, and avalanches.\nWhich danger is NOT mentioned?",["Altitude sickness","Avalanches","Rockfalls","Extreme cold"],2,"Hanya tiga bahaya yang disebut: altitude sickness, extreme cold, avalanches. Rockfalls tidak disebut. Perhatikan kata NOT pada pertanyaan.");
q("LB","Behavioral economists study how people actually make decisions. They explore biases such as loss aversion, where losses feel worse than equal gains, and overconfidence.\nWhich bias is mentioned?",["Framing effect","Anchoring","Loss aversion","Herding"],2,"Bias yang disebut adalah loss aversion (dan overconfidence). Pilihan lain tidak muncul.");
q("LB","Coral reefs host thousands of species, but 50 percent of them have been lost in the last 30 years.\nHow much of the reef has been lost?",["10%","30%","50%","70%"],2,"Persentasenya disebut langsung: 50%. Angka 30 adalah jangka waktu (30 tahun), jebakan yang umum.");

/* ---------- LISTENING C ---------- */
q("LC","A: Should we do the field trip at the beach or in the forest?\nB: The forest, I think. Our professor specializes in botany.\nA: Good point. Let’s go with the forest.\nWhy did they choose the forest?",["Easier access","The professor’s botany focus","Better weather","Cheaper trip"],1,"Alasan disebutkan langsung: dosen mereka ahli botani (“specializes in botany”).");
q("LC","A: We need to hire an assistant for the department.\nB: Right. Someone with technical skills, but also good communication skills.\nA: Agreed, we need both.\nWhat qualities do they want in the assistant?",["Technical skills only","Communication skills only","Both technical and communication skills","Leadership skills"],2,"Keduanya sepakat membutuhkan “both”, yaitu kemampuan teknis dan komunikasi.");
q("LC","A: How should we spend our tutoring sessions?\nB: Let’s start with reading, and then do peer review of my essays.\nA: Sounds good.\nWhat is their plan?",["Grammar drills only","Peer review only","Reading and peer review","Online quizzes"],2,"Mereka sepakat menggabungkan membaca dan peer review.");
q("LC","A: Should we use only surveys?\nB: Surveys alone won’t be enough. Let’s add interviews too.\nA: A mixed-method approach, then.\nWhat method did they choose?",["Surveys only","Interviews only","Mixed-method","Observation"],2,"Metodenya disebut langsung, yaitu mixed-method (gabungan survei dan wawancara).");
q("LC","A: How often should the team check progress?\nB: Every two weeks should work.\nA: Fine, an interim milestone every two weeks.\nHow often will they meet?",["Every week","Every two weeks","Every month","Every quarter"],1,"“Every two weeks” berarti dua minggu sekali.");
q("LC","A: What’s the grading breakdown for this course?\nB: Homework is 20 percent, the midterm is 30 percent, and the final exam is 50 percent.\nHow much is the final exam worth?",["20%","30%","50%","100%"],2,"Komposisi nilai disebut jelas: ujian akhir bernilai 50 persen.");
q("LC","A: Should we translate this passage into our own language?\nB: I think we’ll learn more if we analyze and discuss it instead.\nA: Okay, let’s do that.\nWhat did they decide to do?",["Translate it","Analyze and discuss it","Do both","Skip the text"],1,"Keputusannya “analyze and discuss”, bukan menerjemahkan.");
q("LC","A: We should record the water temperature.\nB: And the pH, too.\nA: Okay, we’ll monitor both.\nWhat will they monitor?",["Temperature only","pH only","Both temperature and pH","Pressure"],2,"Kata kunci “monitor both” berarti suhu dan pH diamati.");
q("LC","A: Tuesday evening doesn’t work for me.\nB: Saturday morning is hard for me, too. How about Wednesday afternoon?\nA: That works.\nWhen will the book club meet?",["Tuesday evening","Wednesday afternoon","Saturday morning","Thursday morning"],1,"Hasil kompromi mereka: Rabu sore (“Wednesday afternoon”).");
q("LC","A: Is your data ready for the paper?\nB: Not yet. I’ll run three more experiments before I start writing.\nWhat will the student do next?",["Publish immediately","Run three more experiments","Stop the research","Write without data"],1,"B akan menjalankan tiga eksperimen lagi sebelum mulai menulis.");

/* ---------- STRUCTURE A: ERROR RECOGNITION ---------- */
E("The committee (A) have decided (B) to postpone (C) the meeting (D) until next Monday.",0,"Bagian A. “Committee” dipakai sebagai satu kesatuan (singular), jadi kata kerjanya “has decided”, bukan “have decided”.");
E("Each of the students (A) are required (B) to submit (C) a final paper (D) by Friday.",0,"Bagian A. Subjek “Each” selalu singular, jadi “is required”, bukan “are required”.");
E("The professor, along with her assistants, (A) are preparing (B) the final exam (C) for next week (D).",0,"Bagian A. Subjek sebenarnya “The professor” (singular). Frasa “along with …” tidak mengubah jumlah subjek, jadi “is preparing”.");
E("Not only (A) the students (B) but also (C) the teacher (D) were excited about the results.",3,"Bagian D. Pada “not only … but also …”, kata kerja mengikuti subjek terdekat. “The teacher” singular, jadi “was excited”, bukan “were excited”.");
E("If the weather (A) had been better, we (B) would have go (C) to the beach (D) yesterday.",1,"Bagian B. Setelah “would have” dipakai past participle: “would have gone”, bukan “would have go”.");
E("Neither the manager (A) nor the employees (B) wants (C) to change (D) the project scope.",2,"Bagian C. Pada “neither … nor”, kata kerja mengikuti subjek terdekat, yaitu “employees” (jamak). Jadi “want”, bukan “wants”.");
E("By the time we arrived, the lecture (A) already (B) had started (C) an hour (D) ago.",3,"Bagian D. “Ago” dipakai dengan simple past. Dengan past perfect (“had started”), gunakan “before”, misalnya “an hour before”.");
E("She suggested that he (A) attends (B) the seminar (C) to learn more (D) about renewable energy.",0,"Bagian A. Setelah “suggested that” dipakai subjunctive: kata kerja bentuk dasar tanpa -s, yaitu “attend”.");
E("The data, which (A) was collected (B) last month, show (C) a significant (D) increase in sales.",0,"Bagian A. “Data” adalah bentuk jamak, jadi “were collected”.");
E("Hardly had she entered the room (A) when (B) all the lights suddenly (C) goes (D) on.",2,"Bagian C. Cerita berada di masa lampau (“Hardly had she entered”), jadi “goes” harus “went”.");
E("The team will begin the presentation (A) at 10 AM (B) tomorrow, and then (C) will answered (D) questions from the audience.",3,"Bagian D. Setelah “will” dipakai kata kerja bentuk dasar: “will answer”, bukan “will answered”.");
E("Despite (A) of the fact (B) that he studied hard, (C) he did (D) not pass the exam.",0,"Bagian A. Frasa yang benar “Despite the fact that …”. Kata “of” tidak dipakai setelah despite.");
E("Although she (A) tired, she (B) is still (C) working (D) on the project.",0,"Bagian A. Klausa “Although she tired” kehilangan kata kerja bantu. Seharusnya “Although she is tired”.");
E("The books required (A) for the course (B) is listed (C) at the university (D) bookstore.",1,"Bagian B. Subjeknya “The books” (jamak), jadi “are listed”, bukan “is listed”.");
E("Between (A) you and I, there (B) isn’t (C) much difference (D) in results.",0,"Bagian A. Setelah preposisi dipakai bentuk objek: “Between you and me”.");
E("They were discussing (A) whether (B) they should to implement (C) the new policy (D) next month.",1,"Bagian B. Setelah modal “should” dipakai kata kerja dasar tanpa “to”: “they should implement”.");
E("Everyone in the class, including Jake, (A) have (B) to complete (C) the assignment (D) today.",0,"Bagian A. “Everyone” bersubjek singular, jadi “has to complete”.");
E("Neither the proposal (A) nor the funding (B) were (C) adequate (D) for the project.",1,"Bagian B. Pada “neither … nor”, kata kerja mengikuti subjek terdekat, yaitu “funding” (singular). Jadi “was”, bukan “were”.");
E("If she (A) would have known (B) about the issue, she (C) would have helped (D) prevent it.",0,"Bagian A. Conditional type 3: klausa if memakai past perfect, yaitu “had known”, bukan “would have known”.");
E("More than fifty percent (A) of the students (B) has (C) completed (D) the survey.",1,"Bagian B. Subjeknya “students” (jamak), jadi “have completed”, bukan “has completed”.");

/* ---------- STRUCTURE B: SENTENCE COMPLETION ---------- */
q("SB","______ the heavy rain, the event continued as planned.",["Although","Despite","Because","However"],1,"“Despite” diikuti frasa benda (“the heavy rain”) dan menyatakan pertentangan. “Although” harus diikuti klausa.");
q("SB","I prefer coffee ______ tea in the morning.",["than","rather","to","over"],2,"Pola baku: “prefer X to Y”.");
q("SB","She has been working here ______ five years.",["since","for","during","until"],1,"“For” dipakai untuk durasi (five years). “Since” dipakai untuk titik waktu.");
q("SB","If I ______ enough money, I would buy a car.",["have","had","will have","would have"],1,"Conditional type 2: “If + past simple, would + verb”. Jadi “had”.");
q("SB","He’s interested ______ learning more about the program.",["on","to","in","for"],2,"Kolokasi tetap: “interested in” + gerund.");
q("SB","They advised us ______ early to avoid traffic.",["to leave","leaving","leave","left"],0,"Pola: “advise + objek + to infinitive”.");
q("SB","By the time you arrive, we ______ dinner.",["will finish","have finished","had finished","will have finished"],3,"“By the time” + present simple menandakan future perfect di klausa utama: “will have finished”.");
q("SB","She’s used to ______ up early.",["get","getting","to get","got"],1,"“Be used to” (terbiasa) diikuti gerund: “getting”.");
q("SB","I look forward ______ this book.",["read","reading","to read","to reading"],3,"“Look forward to” memakai “to” sebagai preposisi, jadi diikuti gerund: “to reading”.");
q("SB","Not only the students but also the professor ______ the lecture.",["enjoy","enjoys","enjoying","to enjoy"],1,"Pada “not only … but also …”, kata kerja mengikuti subjek terdekat (“the professor”, singular), yaitu “enjoys”.");
q("SB","Although ______ busy, she attended the conference.",["she was","of being","in being","was"],0,"“Although” harus diikuti klausa lengkap (subjek + kata kerja): “Although she was busy”.");
q("SB","He failed the test ______ he studied hard.",["but","and","although","so"],2,"“Although” menyatakan pertentangan: ia gagal meskipun sudah belajar keras. “But” tidak dipakai di tengah kalimat seperti ini tanpa koma dan membalik logika.");
q("SB","It’s important that he ______ on time.",["arrives","arrive","arrived","arriving"],1,"Setelah “important that” dipakai subjunctive: kata kerja bentuk dasar tanpa -s.");
q("SB","______ the weather is good, we’ll go hiking.",["Unless","Provided","Although","Despite"],1,"“Provided (that)” berarti “asalkan”. “Unless” (kecuali) dan “although” membalik makna, sedangkan “despite” tidak diikuti klausa.");
q("SB","They didn’t start the lesson ______ the instructor arrived.",["until","although","despite","unless"],0,"Pola “didn’t … until” berarti baru mulai setelah sesuatu terjadi.");
q("SB","_________ your suggestions, we improved the plan.",["Thanks to","Thank","Thanks for","Thank to"],0,"Idiom baku: “Thanks to your suggestions” (berkat saranmu).");
q("SB","She couldn’t go ______ being sick.",["because of","despite","because","although"],0,"Sakit adalah alasan tidak pergi, jadi “because of” (diikuti gerund). “Despite” menyatakan pertentangan, sedangkan “because” dan “although” harus diikuti klausa.");
q("SB","He decided ______ a break before continuing.",["take","to take","taking","to taking"],1,"“Decide” diikuti to-infinitive: “to take”.");
q("SB","The report must be submitted no later ______ Friday.",["with","than","of","for"],1,"Ungkapan tetap: “no later than” (paling lambat).");
q("SB","We arrived ______ time for the presentation.",["in","at","on","to"],0,"“In time” berarti tiba cukup waktu sebelum acara dimulai. “On time” berarti sesuai jadwal.");

/* ---------- APP ---------- */
const $=s=>document.querySelector(s);
const L="ABCD";
let list=[],idx=0,res=[],locked=false;

// nomor soal per bagian
const cnt={};
D.forEach(d=>{cnt[d.s]=(cnt[d.s]||0)+1;d.n=cnt[d.s]+(d.s==="R2"?10:d.s==="R3"?20:0);});

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function show(id){["menu","quiz","result"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id));window.scrollTo(0,0);}

$("#start").onclick=()=>{
  const g=[...document.querySelectorAll('.menu input[type=checkbox][value]:checked')].map(i=>i.value);
  if(!g.length){alert("Pilih minimal satu materi.");return;}
  begin(D.filter(d=>g.includes(SEC[d.s].g)),$("#shuf").checked);
};
function begin(arr,shuffle){
  list=arr.slice();
  if(shuffle)for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  idx=0;res=new Array(list.length).fill(null);show("quiz");render();
}
function stats(){
  const ok=res.filter(r=>r&&r.c).length,bad=res.filter(r=>r&&!r.c).length;
  $("#sNo").textContent=(idx+1)+"/"+list.length;
  $("#sOk").textContent="Benar "+ok;$("#sBad").textContent="Salah "+bad;
  $("#sLeft").textContent="Sisa "+(list.length-ok-bad);
  $("#pg").style.width=((ok+bad)/list.length*100)+"%";
}
function fmt(d){
  let t=esc(d.t);
  if(d.s==="SA")t=t.replace(/\((A|B|C|D)\)/g,'<b class="m">($1)</b>');
  return t;
}
function split(d){
  // soal Listening: semua baris sebelum baris terakhir = transkrip, baris terakhir = pertanyaan
  const k=d.t.lastIndexOf("\n");
  return k>-1?{sc:d.t.slice(0,k),qs:d.t.slice(k+1)}:{sc:"",qs:d.t};
}
function render(){
  const d=list[idx],S=SEC[d.s],r=res[idx];locked=!!r;
  let h=`<span class="tag">${S.n} · Soal ${d.n}</span><p class="instr">${S.i}</p>`;
  if(S.p)h+=`<div class="passage">${S.p}</div>`;
  if(S.g==="L"){
    const x=split(d);
    h+=`<div class="script"><span class="slabel">Transkrip</span>${esc(x.sc)}</div><div class="qtext">${esc(x.qs)}</div>`;
  }else{
    h+=`<div class="qtext">${fmt(d)}</div>`;
  }
  h+=`<div id="opts">`;
  d.o.forEach((o,i)=>{h+=`<button class="choice" data-i="${i}"><span class="l">${L[i]}</span><span>${d.s==="SA"?"Bagian "+o:esc(o)}</span></button>`;});
  h+=`</div><div id="fb"></div>`;
  $("#qcard").innerHTML=h;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $("#next").textContent=idx===list.length-1?"Lihat hasil":"Soal berikutnya";
  $("#next").disabled=!r;
  if(r)mark(r.pick);
  stats();
}
function answer(i){
  if(locked)return;locked=true;
  const d=list[idx];res[idx]={pick:i,c:i===d.a};
  mark(i);$("#next").disabled=false;stats();
}
function mark(pick){
  const d=list[idx],c=pick===d.a;
  document.querySelectorAll(".choice").forEach((b,i)=>{
    b.disabled=true;
    if(i===d.a)b.classList.add("ok");
    else if(i===pick)b.classList.add("bad");
  });
  const ans=L[d.a]+". "+(d.s==="SA"?"Bagian "+d.o[d.a]:d.o[d.a]);
  $("#fb").innerHTML=`<div class="fb ${c?"ok":"bad"}"><strong>${c?"✅ Benar!":"❌ Salah"}</strong>${c?"":"Jawaban yang benar: <b>"+esc(ans)+"</b><br>"}<b>Pembahasan:</b> ${esc(d.e)}</div>`;
}
$("#next").onclick=()=>{
  if($("#next").disabled)return;
  if(idx<list.length-1){idx++;render();window.scrollTo(0,0);}else finish();
};
$("#quit").onclick=()=>{if(confirm("Keluar dari kuis? Progres akan hilang."))show("menu");};

// pintasan keyboard: A-D / 1-4 untuk memilih, Enter atau panah kanan untuk lanjut
document.addEventListener("keydown",e=>{
  if($("#quiz").classList.contains("hide")||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),m="abcd".indexOf(k),n="1234".indexOf(k);
  const i=m>-1?m:n;
  if(i>-1&&i<list[idx].o.length){answer(i);return;}
  if((k==="enter"||k==="arrowright")&&!$("#next").disabled){e.preventDefault();$("#next").click();}
});

function finish(){
  const ok=res.filter(r=>r&&r.c).length,tot=list.length,bad=tot-ok;
  const pct=Math.round(ok/tot*100);
  const by={};list.forEach((d,i)=>{const g=SEC[d.s].g;by[g]=by[g]||{t:0,o:0};by[g].t++;if(res[i]&&res[i].c)by[g].o++;});
  let rows="";Object.keys(by).forEach(g=>{rows+=`<tr><td>${GN[g]}</td><td>${by[g].o}</td><td>${by[g].t-by[g].o}</td><td>${Math.round(by[g].o/by[g].t*100)}%</td></tr>`;});
  const wrong=list.map((d,i)=>({d,i})).filter(x=>!res[x.i]||!res[x.i].c);
  let rev="";
  wrong.forEach(({d,i})=>{
    const r=res[i];
    const lab=(k)=>L[k]+". "+(d.s==="SA"?"Bagian "+d.o[k]:d.o[k]);
    rev+=`<div class="rev"><span class="tag">${SEC[d.s].n} · Soal ${d.n}</span>`
    +(SEC[d.s].p?`<div class="passage">${SEC[d.s].p}</div>`:"")
    +`<div class="qtext" style="font-size:15px">${fmt(d)}</div>`
    +(r?`<div>Jawabanmu: <b style="color:var(--bad)">${esc(lab(r.pick))}</b></div>`:"")
    +`<div>Jawaban benar: <b style="color:var(--ok)">${esc(lab(d.a))}</b></div><div style="color:var(--mute);margin-top:4px">${esc(d.e)}</div></div>`;
  });
  $("#result").innerHTML=`<div class="hero"><h1>Hasil kuis</h1></div>
  <div class="card"><div class="score">${pct}%</div>
  <p style="margin:8px 0 0"><b style="color:var(--ok)">Benar ${ok}</b> · <b style="color:var(--bad)">Salah ${bad}</b> · Total ${tot} soal</p>
  <table class="tbl"><tr><th>Materi</th><th>Benar</th><th>Salah</th><th>Skor</th></tr>${rows}</table>
  <div class="row"><button class="btn" id="again">Ulangi semua</button>${wrong.length?'<button class="btn alt" id="retry">Ulangi yang salah ('+wrong.length+')</button>':""}<button class="btn alt" id="home">Menu utama</button></div></div>
  ${wrong.length?`<div class="card"><h2 style="font-size:20px">Pembahasan soal yang salah</h2>${rev}</div>`:`<div class="card"><b>Sempurna!</b> Semua jawabanmu benar.</div>`}`;
  show("result");
  $("#again").onclick=()=>begin(list,$("#shuf").checked);
  if($("#retry"))$("#retry").onclick=()=>begin(wrong.map(x=>x.d),false);
  $("#home").onclick=()=>show("menu");
}
</script>
</body>
</html>
