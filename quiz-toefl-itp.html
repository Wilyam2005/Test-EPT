<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis TOEFL ITP – 100 Soal dan Pembahasan</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#17203d;--mute:#5d6783;--line:#dde2ee;--accent:#1e3a8a;--accent2:#0f8b8d;--ok:#12805c;--okbg:#e4f6ee;--bad:#b3261e;--badbg:#fdeceb;--warn:#8a5a00;--warnbg:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1426;--card:#171e36;--ink:#e8ecfa;--mute:#9aa5c7;--line:#2a3354;--accent:#8fa8ff;--accent2:#4fd1c5;--ok:#5fe0ae;--okbg:#10352b;--bad:#ff8f87;--badbg:#3a1a1c;--warn:#ffd271;--warnbg:#3a2f12}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(26px,6vw,38px)}
.hero p{color:var(--mute);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.menu label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px;cursor:pointer}
.menu label.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.menu input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.menu small{display:block;color:var(--mute)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:600;min-height:48px}
@media(prefers-color-scheme:dark){.btn{color:#0f1426}}
.btn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible,.tts:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1 1 150px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s}
.tag{display:inline-block;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:6px}
.instr{color:var(--mute);font-size:14px;margin:0 0 10px}
.passage{background:var(--bg);border-left:4px solid var(--accent2);padding:12px 14px;border-radius:6px;margin:10px 0;font-size:15px}
.qtext{white-space:pre-line;font-size:17px;margin:10px 0 14px}
.qtext b.m{color:var(--accent2);font-weight:700}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:9px;min-height:48px}
.choice:not(:disabled):hover{border-color:var(--accent)}
.choice .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.choice.ok{border-color:var(--ok);background:var(--okbg)}.choice.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.bad{border-color:var(--bad);background:var(--badbg)}.choice.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.choice:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;padding:14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:14px}
.tts{background:transparent;border:1.5px solid var(--accent2);color:var(--accent2);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.score{font-family:Georgia,serif;font-size:64px;color:var(--accent);line-height:1}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right}
.rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-size:15px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="menu" class="menu">
  <div class="hero">
    <h1>Kuis TOEFL ITP</h1>
    <p>100 soal dengan pembahasan berbahasa Indonesia. Skor benar dan salah dihitung otomatis.</p>
  </div>
  <div class="card">
    <h2 style="font-size:20px">Pilih materi</h2>
    <label class="opt"><input type="checkbox" value="L" checked><span><b>Listening Comprehension</b><small>30 soal · Dialog singkat, monolog, diskusi</small></span></label>
    <label class="opt"><input type="checkbox" value="S" checked><span><b>Structure &amp; Written Expression</b><small>40 soal · Error recognition dan sentence completion</small></span></label>
    <label class="opt"><input type="checkbox" value="R" checked><span><b>Reading Comprehension</b><small>30 soal · 3 passage</small></span></label>
    <label class="opt"><input type="checkbox" id="shuf"><span><b>Acak urutan soal</b><small>Soal dikocok setiap kali mulai</small></span></label>
    <div class="row"><button class="btn" id="start">Mulai kuis</button></div>
  </div>
</div>

<div id="quiz" class="hide">
  <div class="bar">
    <div class="stats"><span class="pill" id="sNo">1/100</span><span class="pill ok" id="sOk">Benar 0</span><span class="pill bad" id="sBad">Salah 0</span><span class="pill" id="sLeft">Sisa 0</span></div>
    <div class="prog"><i id="pg"></i></div>
  </div>
  <div class="card" id="qcard"></div>
  <div class="row"><button class="btn alt" id="quit">Keluar ke menu</button><button class="btn" id="next" disabled>Soal berikutnya</button></div>
</div>

<div id="result" class="hide"></div>

</div>

<script>
const D=[];
const q=(s,t,o,a,e)=>D.push({s,t,o,a,e});
const E=(t,a,e)=>q("SA",t,["A","B","C","D"],a,e);

const SEC={
LA:{n:"Listening · Bagian A: Dialog Singkat",g:"L",i:"Dengarkan dialog (tombol putar audio) lalu jawab pertanyaan. Di tes asli audio hanya diputar sekali."},
LB:{n:"Listening · Bagian B: Monolog Pendek",g:"L",i:"Fokus pada gagasan utama dan detail yang disebut pembicara."},
LC:{n:"Listening · Bagian C: Dialog/Diskusi Kompleks",g:"L",i:"Perhatikan keputusan akhir yang disepakati pembicara."},
SA:{n:"Structure · A: Error Recognition",g:"S",i:"Tandai bagian (A/B/C/D) yang salah."},
SB:{n:"Structure · B: Sentence Completion",g:"S",i:"Pilih jawaban terbaik."},
R1:{n:"Reading · Passage 1: Photosynthesis Basics",g:"R",i:"Baca passage lalu jawab pertanyaan.",p:"Photosynthesis is the process by which green plants convert sunlight into chemical energy. In chloroplasts, chlorophyll captures light, primarily in blue and red wavelengths. The absorbed energy drives two main stages: the light-dependent reactions and the Calvin cycle. In the first stage, water molecules split, producing oxygen and transferring energy to ATP and NADPH. In the Calvin cycle, the plant uses ATP and NADPH to transform carbon dioxide into glucose."},
R2:{n:"Reading · Passage 2: Urbanization and Public Health",g:"R",i:"Baca passage lalu jawab pertanyaan.",p:"Urbanization is growing fast and brings health problems: disease transmission, pollution, and sanitation issues. Poor people in cities are most at risk. Governments improve waste systems, hospitals, and promote health education. Sustainable designs help lower disease and improve life."},
R3:{n:"Reading · Passage 3: Industrial Revolution Overview",g:"R",i:"Baca passage lalu jawab pertanyaan.",p:"The Industrial Revolution changed production. Before, goods were handmade. Factories increased output but caused labor problems. Reformers pushed for labor laws. By mid-19th century, regulations were made."}
};
const GN={L:"Listening Comprehension",S:"Structure & Written Expression",R:"Reading Comprehension"};

/* ---------- LISTENING A ---------- */
q("LA","A: Are you going to the faculty meeting today?\nB: No, it’s been canceled.\nWhat does the woman say about the meeting?",["It’s on schedule","It’s postponed","It’s canceled","She’s attending"],2,"B menyebut meeting “been canceled”, artinya rapat dibatalkan, bukan ditunda.");
q("LA","A: Do you want cream or sugar with your coffee?\nB: Just cream, thanks.\nWhat does the man want in his coffee?",["Sugar","Cream","Both","Neither"],1,"B menjawab “Just cream”, jadi ia hanya ingin krim.");
q("LA","A: Where is the student ID office located?\nB: On the first floor of the administration building.\nWhere should they go?",["Library","Administration building","Student center","Cafeteria"],1,"Lokasi disebut jelas: “administration building” lantai satu.");
q("LA","A: How much does this textbook cost?\nB: It’s around $45, but you can get it used for $30.\nWhat’s the price of the used textbook?",["$45","$30","$15","$60"],1,"$45 adalah harga baru. Harga bekas disebut “used for $30”.");
q("LA","A: When is the paper due?\nB: Next Wednesday at noon.\nWhen is the deadline?",["Wednesday morning","Wednesday noon","Tuesday evening","Thursday noon"],1,"Batas waktunya “Wednesday at noon”, yaitu Rabu siang pukul 12.");
q("LA","A: Did you enjoy the concert last night?\nB: Yes, especially the violin solo.\nWhat did the man enjoy most?",["The piano solo","The drum performance","The violin solo","The opening group"],2,"B menyebut “especially the violin solo”, yaitu bagian yang paling ia nikmati.");
q("LA","A: Can I borrow your calculator?\nB: Sorry, I need it for my exam.\nWhy can’t she lend the calculator?",["She lost it","She needs it","It’s broken","It’s her property"],1,"B tidak bisa meminjamkan karena ia sendiri membutuhkan kalkulator untuk ujiannya.");
q("LA","A: Are you registering for the seminar?\nB: Yes, but I need to pay the fee first.\nWhat does she need to do before registering?",["Send an email","Find the seminar schedule","Pay the fee","Get approval"],2,"B harus “pay the fee first”, yaitu membayar biaya sebelum mendaftar.");
q("LA","A: Have you finished the reading assignment?\nB: Not yet, I’m halfway through Chapter 4.\nHow far has he read?",["Chapter 2","Chapter 3","Half of Chapter 4","Chapter 5"],2,"“Halfway through Chapter 4” berarti baru membaca separuh Bab 4.");
q("LA","A: Is the chemistry lab available this afternoon?\nB: Yes, it’s free between 2 and 4 PM.\nWhen is the lab available?",["1–2 PM","2–4 PM","3–5 PM","Not available"],1,"B memberi rentang waktu kosong pukul 2 sampai 4 sore.");

/* ---------- LISTENING B ---------- */
q("LB","“Today’s lecture covers the water cycle: evaporation, condensation, precipitation, and collection…”\nWhat is the main topic?",["Ocean currents","Water cycle","Weather forecasting","River ecosystems"],1,"Topik utama disebut di awal: “the water cycle”. Empat tahap sesudahnya hanyalah rinciannya.");
q("LB","“In cell division, mitosis ensures that each daughter cell receives a full set of chromosomes…”\nWhat process is described?",["Photosynthesis","Mitosis","Meiosis","Respiration"],1,"Kata kunci “mitosis” disebut langsung. Meiosis menghasilkan setengah set kromosom, jadi tidak cocok.");
q("LB","“Economic inflation refers to the increasing prices of goods and services over time, which reduces purchasing power…”\nWhat does inflation reduce?",["Currency value","Loan interest","Government spending","Import taxes"],0,"Inflasi menurunkan daya beli (purchasing power), yang berarti nilai uang berkurang.");
q("LB","“The Great Barrier Reef … facing threats from climate change and overfishing…”\nWhat threatens the reef?",["Volcanoes","Desertification","Climate change","Urbanization"],2,"Dua ancaman disebut, yaitu climate change dan overfishing. Hanya climate change yang ada di pilihan.");
q("LB","“To make ethical decisions, one must weigh pros and cons … utilitarianism or deontology…”\nWhat is the speaker focusing on?",["Business ethics","Financial planning","Scientific method","Communication skills"],0,"Pembicara membahas pengambilan keputusan etis dan teori moral (utilitarianism, deontology). Pilihan terdekat adalah business ethics.");
q("LB","“In Shakespeare’s ‘Hamlet,’ the prince struggles with revenge, mortality, and mental unrest…”\nWhat character issue is mentioned?",["Love","Madness","Friendship","Betrayal"],1,"“Mental unrest” (gejolak batin) mengarah pada kegilaan atau madness.");
q("LB","“A balanced diet includes carbohydrates, proteins, fats… proteins build tissues…”\nWhich nutrient builds tissues?",["Carbohydrates","Fats","Proteins","Vitamins"],2,"Teks menyatakan langsung “proteins build tissues”.");
q("LB","“Mount Everest … dangers like altitude sickness, extreme cold, and avalanches…”\nWhat danger isn’t mentioned?",["Altitude sickness","Avalanches","Rockfalls","Extreme cold"],2,"Hanya tiga bahaya yang disebut: altitude sickness, extreme cold, avalanches. Rockfalls tidak disebut. Perhatikan kata NOT/isn’t pada pertanyaan.");
q("LB","“Behavioral economists … explore biases like loss aversion and overconfidence…”\nWhich bias is cited?",["Framing effect","Anchoring","Loss aversion","Herding"],2,"Bias yang disebut adalah loss aversion (dan overconfidence). Pilihan lain tidak muncul.");
q("LB","“Coral reefs host thousands of species … but 50% have been lost in the last 30 years…”\nHow much reef has been lost?",["10%","30%","50%","70%"],2,"Persentasenya disebut langsung: 50%. Angka 30 adalah jangka waktu (30 tahun), jebakan yang umum.");

/* ---------- LISTENING C ---------- */
q("LC","Students debate beach vs. forest; choose forest because professor specializes in botany.\nWhy did they pick the forest?",["Easier access","Botany focus","Better weather","Cheaper trip"],1,"Alasan langsung disebutkan: dosen mereka ahli botani, jadi hutan dipilih.");
q("LC","Colleagues hire assistant; want both technical & communication skills.\nWhat qualities do they want?",["Technical only","Communication only","Both technical & communication","Leadership"],2,"Keputusan menyebut kedua kemampuan (“both sets”), bukan salah satu.");
q("LC","Teacher & student set plan: reading + peer review.\nWhat’s their plan?",["Grammar drills only","Peer review only","Reading & peer review","Online quizzes"],2,"Mereka sepakat menggabungkan membaca dan peer review.");
q("LC","Researchers choose mixed-method combining surveys + interviews.\nWhat method did they choose?",["Surveys","Interviews","Mixed-method","Observation"],2,"Metodenya disebut langsung, yaitu mixed-method (gabungan survei dan wawancara).");
q("LC","Team sets interim milestones every two weeks.\nHow often will they meet?",["Weekly","Bi-weekly","Monthly","Quarterly"],1,"Setiap dua minggu sama dengan bi-weekly.");
q("LC","Grading: homework 20%, midterm 30%, final 50%.\nHow much is the final exam worth?",["20%","30%","50%","100%"],2,"Komposisi nilai disebut jelas: ujian akhir bernilai 50%.");
q("LC","Students decide to analyze passages, tidak menerjemah.\nWhat did they decide?",["Translate it","Analyze passages","Do both","Ignore the text"],1,"Keputusannya “analyze and discuss”, bukan menerjemah.");
q("LC","Scientists agree to monitor both temperature and pH.\nWhat will they monitor?",["Temperature only","pH only","Both temperature and pH","Pressure"],2,"Kata kunci “monitor both” berarti keduanya diamati.");
q("LC","Book club kompromi: Wednesday afternoon.\nWhen is the club meeting?",["Tuesday evening","Wednesday afternoon","Saturday morning","Thursday morning"],1,"Hasil kompromi mereka: Rabu sore.");
q("LC","Student akan lakukan tiga eksperimen lagi sebelum menulis.\nWhat will the student do next?",["Publish immediately","Do three more tests","Stop research","Write without data"],1,"Disepakati mengumpulkan tiga eksperimen lagi sebelum menulis.");

/* ---------- STRUCTURE A: ERROR RECOGNITION ---------- */
E("The committee (A) have decided (B) to postpone (C) the meeting (D) until next Monday.",0,"“Committee” dipakai sebagai satu kesatuan (singular), jadi kata kerjanya “has decided”, bukan “have decided”.");
E("Each of the students (A) is required (B) to submit their (C) assignments (D) by Friday.",2,"“Each” bersubjek singular. Kunci: “their” diganti “his or her” (dan “assignments” menjadi singular “assignment”).");
E("The professor, along with her assistants, (A) are preparing (B) the final exam (C) for next week (D).",0,"Subjek sebenarnya “The professor” (singular). Frasa “along with …” tidak mengubah jumlah subjek, jadi “is preparing”.");
E("Not only (A) the students (B) but also (C) the teacher (D) were excited about the results.",0,"Kunci dokumen: A. Catatan: kalimat ini berpola “not only … but also …” dengan kata kerja mengikuti subjek terdekat. “The teacher” singular, sehingga kata kerja yang tepat “was”, bukan “were”. Tinjau kembali jika kamu memakainya sebagai bahan latihan resmi.");
E("If he (A) had known about the meeting, he (B) would have attended (C) it but (D) he didn’t.",3,"Conditional type 3 menyatakan hal yang tidak terjadi. Bagian “but he didn’t” redundan dengan makna kalimat, sehingga bagian D dianggap salah menurut kunci. Pola benar: “If he had known…, he would have attended it.”");
E("Neither the manager (A) nor the employees (B) wants (C) to change (D) the project scope.",2,"Pada “neither … nor”, kata kerja mengikuti subjek terdekat, yaitu “employees” (jamak). Maka “want”, bukan “wants”.");
E("By the time we arrived, the lecture (A) already (B) had started (C) an hour (D) ago.",1,"Urutan kata salah. Posisi “already” sebaiknya setelah “had” (“had already started”). Catatan: “ago” juga janggal dengan past perfect.");
E("She suggested that he (A) attends (B) the seminar (C) to learn more (D) about renewable energy.",0,"Setelah “suggested that” dipakai subjunctive: kata kerja bentuk dasar tanpa -s, yaitu “attend”.");
E("The data, which (A) was collected (B) last month, show (C) a significant (D) increase in sales.",0,"“Data” adalah bentuk jamak, jadi “were collected”. Perhatikan konsistensi dengan “show” yang sudah jamak.");
E("Hardly had she entered the room (A) when (B) all the lights suddenly (C) goes (D) on.",3,"Cerita berada di masa lampau, jadi “goes” harus “went”.");
E("The team will begin the presentation (A) at 10 AM (B) tomorrow, and (C) then (D) they will answer questions.",3,"“They” redundan karena subjek sama dengan klausa pertama. Cukup “…and then answer questions.”");
E("Despite (A) of the fact (B) that he studied hard, (C) he did (D) not pass the exam.",1,"Frasa yang benar “Despite the fact that …”. Kata “of” tidak dipakai setelah despite.");
E("Although she (A) is tired, she (B) still (C) working (D) on the project.",3,"Perlu kata kerja bantu untuk present continuous: “is still working”. Kunci menandai bagian D.");
E("The book required (A) for the course are (B) listed (C) at the university (D) bookstore.",0,"Kata kerja “are” bersubjek jamak, jadi “The books required …”. Kunci menandai bagian A (subjeknya).");
E("Between (A) you and I, there (B) isn’t (C) much difference (D) in results.",0,"Setelah preposisi dipakai bentuk objek: “Between you and me”.");
E("They were discussing (A) whether (B) they should to implement (C) the new policy (D) next month.",2,"Setelah modal “should” dipakai kata kerja dasar tanpa “to”: “should implement”.");
E("Everyone in the class, including Jake, (A) have (B) to complete (C) the assignment (D) today.",1,"“Everyone” bersubjek singular, jadi “has to complete”.");
E("Neither the proposal (A) nor the funding (B) were (C) adequate enough (D) for the project.",3,"“Adequate enough” redundan karena adequate sudah berarti cukup. Pilih salah satu. Catatan: “were” juga sebaiknya “was” (subjek terdekat “funding” singular).");
E("If she (A) would have known (B) about the issue, she (C) would help (D) prevent it.",0,"Conditional type 3: klausa if memakai past perfect, yaitu “If she had known”, bukan “would have known”.");
E("More than fifty percent (A) of the students (B) has (C) completed (D) the survey.",2,"Subjeknya “students” (jamak), jadi “have completed”.");

/* ---------- STRUCTURE B: SENTENCE COMPLETION ---------- */
q("SB","Despite ______ heavy rain, the event continued as planned.",["it was","of","it being","having been"],2,"Setelah “despite” harus ada kata benda atau gerund. “Despite it being heavy rain” memenuhi pola tersebut.");
q("SB","I prefer coffee ______ tea in the morning.",["than","rather","to","over"],2,"Pola baku: “prefer X to Y”.");
q("SB","She has been working here ______ five years.",["since","for","during","until"],1,"“For” dipakai untuk durasi (five years). “Since” dipakai untuk titik waktu.");
q("SB","If I ______ enough money, I would buy a car.",["have","had","will have","would have"],1,"Conditional type 2: “If + past simple, would + verb”. Jadi “had”.");
q("SB","He’s interested ______ learning more about the program.",["on","to","in","for"],2,"Kolokasi tetap: “interested in” + gerund.");
q("SB","They advised us ______ early to avoid traffic.",["to leave","leaving","leave","left"],0,"Pola: “advise + objek + to infinitive”.");
q("SB","By the time you arrive, we ______ dinner.",["will finish","have finished","had finished","will have finished"],3,"“By the time” + present simple menandakan future perfect di klausa utama: “will have finished”.");
q("SB","She’s used to ______ up early.",["get","getting","to get","got"],1,"“Be used to” (terbiasa) diikuti gerund: “getting”.");
q("SB","I look forward ______ this book.",["read","reading","to read","to reading"],3,"“Look forward to” memakai “to” sebagai preposisi, jadi diikuti gerund: “to reading”.");
q("SB","Not only the students ______ the lecture, but also the professor.",["enjoy","enjoys","enjoying","enjoyed"],0,"Kunci dokumen: “enjoy”. ⚠️ Catatan: pada pola “not only … but also …” kata kerja biasanya mengikuti subjek terdekat (“the professor”, singular), yaitu “enjoys”. Dokumen sumber sendiri menandai soal ini untuk ditinjau kembali.");
q("SB","Although ______ busy, she attended the conference.",["she was","of being","being","was"],2,"Kunci dokumen: “being”. ⚠️ Catatan: bentuk yang lebih baku adalah “Although she was busy”. Dokumen sumber menandai soal ini untuk ditinjau kembali.");
q("SB","He failed the test ______ he studied hard.",["but","and","although","so"],0,"Kunci dokumen: “but”. ⚠️ Catatan: secara makna, “although” lebih tepat untuk menyatakan pertentangan dalam satu kalimat. Dokumen sumber menandai soal ini untuk ditinjau kembali.");
q("SB","It’s important that he ______ on time.",["arrives","arrive","arrived","arriving"],1,"Setelah “important that” dipakai subjunctive: kata kerja bentuk dasar tanpa -s.");
q("SB","______ the weather is good, we’ll go hiking.",["If","Unless","Provided","Although"],2,"Kunci dokumen: “Provided (that)” yang berarti “asalkan”. Catatan: “If” juga masuk akal secara tata bahasa.");
q("SB","They didn’t start until ______ the instructor arrived.",["when","until","although","after"],3,"“Until after” menandai bahwa mereka baru mulai sesudah instruktur datang.");
q("SB","_________ to your suggestions, we improved the plan.",["Thanks","Thank","Thanks for","Thank to"],2,"Kunci dokumen: “Thanks for”. ⚠️ Catatan: idiom baku adalah “Thanks to your suggestions” (berkat saranmu). Dokumen sumber menandai soal ini untuk ditinjau kembali.");
q("SB","She couldn’t go ______ being sick.",["because","despite","due","although"],1,"Kunci dokumen: “despite”. ⚠️ Catatan: secara makna, “because of” atau “due to” lebih pas (sakit adalah alasan tidak pergi). Dokumen sumber menandai soal ini untuk ditinjau kembali.");
q("SB","He decided ______ a break before continuing.",["take","to take","taking","to taking"],1,"“Decide” diikuti to-infinitive: “to take”.");
q("SB","The report must be submitted no later ______ Friday.",["with","than","of","for"],1,"Ungkapan tetap: “no later than” (paling lambat).");
q("SB","We arrived ______ time for the presentation.",["in","at","on","to"],0,"“In time” berarti tiba tepat waktu atau cukup waktu. “On time” berarti sesuai jadwal.");

q("R1","What does “engineered crops” mean?",["Crops grown without water","Genetically or biologically modified","Crops grown indoors only","Crops harvested by machines"],1,"“Engineered” berarti direkayasa, yaitu tanaman yang diubah secara genetik atau biologis agar lebih adaptif.");
q("R1","Why is understanding photosynthesis important?",["To reduce sunlight","To increase pesticides","To improve crop adaptation","To replace chlorophyll"],2,"Disampaikan pada kalimat terakhir: pemahaman ini membantu meningkatkan adaptasi tanaman.");

q("R2","Dense populations cause:",["Lower pollution","Disease spread","Better sanitation","Cheaper housing"],1,"Disebutkan langsung: urbanisasi membawa penularan penyakit.");

q("R3","What is the main idea?",["The invention of the steam engine","Biography of reformers","Industrial Revolution effects","Agricultural decline"],2,"Teks membahas dampak sosial dan ekonomi Revolusi Industri.");
q("R3","How were goods made before factories?",["By robots","By steam","By hand","By computers"],2,"Disebutkan di awal: “Before, goods were handmade”.");

q("R3","Reform movements aimed to:",["Reduce factory output","Improve worker conditions","Return to handmade production","Abolish machines"],1,"Reformis mendorong hukum ketenagakerjaan untuk memperbaiki kondisi pekerja.");

q("R3","What was a benefit of factories?",["Fewer jobs","Lower quality","Higher output","Handmade quality"],2,"Teks menyebut pabrik meningkatkan output, yaitu produktivitas naik drastis.");
q("R3","Debates involved:",["Art vs. science","Growth vs. rights","Trade vs. travel","Religion vs. law"],1,"Perdebatan berkisar pada pertumbuhan industri versus hak-hak pekerja.");
q("R3","What is the meaning of “mechanized looms”?",["Hand-operated looms","Machine-driven looms","Looms made of metal only","Abandoned looms"],1,"Mekanisasi berarti mesin menggantikan tenaga tangan manusia, jadi alat tenun digerakkan mesin.");
q("R3","Pollution during the Industrial Revolution was:",["Nonexistent","Widespread","Minimal","Limited to farms"],1,"Polusi adalah salah satu konsekuensi utama dan menyebar luas.");

/* ---------- APP ---------- */
const $=s=>document.querySelector(s);
const L="ABCD";
let list=[],idx=0,res=[],locked=false;

// nomor per bagian
const cnt={};D.forEach(d=>{cnt[d.s]=(cnt[d.s]||0)+1;d.n=cnt[d.s]+(d.s[0]==="R"?(d.s==="R2"?10:d.s==="R3"?20:0):0);});
D.forEach((d,i)=>d.id=i);

function show(id){["menu","quiz","result"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id));window.scrollTo(0,0);window.speechSynthesis&&speechSynthesis.cancel();}

$("#start").onclick=()=>{
  const g=[...document.querySelectorAll('.menu input[value]:checked')].map(i=>i.value);
  if(!g.length){alert("Pilih minimal satu materi.");return;}
  begin(D.filter(d=>g.includes(SEC[d.s].g)),$("#shuf").checked);
};
function begin(arr,shuffle){
  list=arr.slice();
  if(shuffle)for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  idx=0;res=new Array(list.length).fill(null);show("quiz");render();
}
function stats(){
  const ok=res.filter(r=>r&&r.c).length,bad=res.filter(r=>r&&!r.c).length;
  $("#sNo").textContent=(idx+1)+"/"+list.length;
  $("#sOk").textContent="Benar "+ok;$("#sBad").textContent="Salah "+bad;
  $("#sLeft").textContent="Sisa "+(list.length-ok-bad);
  $("#pg").style.width=((ok+bad)/list.length*100)+"%";
}
function fmt(d){
  let t=d.t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  if(d.s==="SA")t=t.replace(/\((A|B|C|D)\)/g,'<b class="m">($1)</b>');
  return t;
}
function render(){
  const d=list[idx],S=SEC[d.s],r=res[idx];locked=!!r;
  const listen=S.g==="L";
  let h=`<span class="tag">${S.n} · Soal ${d.n}</span><p class="instr">${S.i}</p>`;
  if(S.p)h+=`<div class="passage">${S.p}</div>`;
  if(listen)h+=`<button class="tts" id="tts" type="button">🔊 Putar audio</button>`;
  h+=`<div class="qtext">${fmt(d)}</div><div id="opts">`;
  d.o.forEach((o,i)=>{h+=`<button class="choice" data-i="${i}"><span class="l">${L[i]}</span><span>${d.s==="SA"?"Bagian "+o:o}</span></button>`;});
  h+=`</div><div id="fb"></div>`;
  $("#qcard").innerHTML=h;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const tb=$("#tts");if(tb)tb.onclick=()=>speak(d.t);
  $("#next").textContent=idx===list.length-1?"Lihat hasil":"Soal berikutnya";
  $("#next").disabled=!r;
  if(r)mark(r.pick);
  stats();
}
function speak(t){
  if(!window.speechSynthesis){alert("Perangkat ini tidak mendukung audio otomatis. Silakan baca teks soal.");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/^[AB]: /gm,"").replace(/\n/g,". "));
  u.lang="en-US";u.rate=.92;speechSynthesis.speak(u);
}
function answer(i){
  if(locked)return;locked=true;
  const d=list[idx];res[idx]={pick:i,c:i===d.a};
  mark(i);$("#next").disabled=false;stats();
}
function mark(pick){
  const d=list[idx],c=pick===d.a;
  document.querySelectorAll(".choice").forEach((b,i)=>{
    b.disabled=true;
    if(i===d.a)b.classList.add("ok");
    else if(i===pick)b.classList.add("bad");
  });
  const ans=L[d.a]+". "+d.o[d.a];
  let note="";let e=d.e;
  const k=e.indexOf("⚠️");
  if(k>-1){note=e.slice(k);e=e.slice(0,k).trim();}
  $("#fb").innerHTML=`<div class="fb ${c?"ok":"bad"}"><strong>${c?"✅ Benar!":"❌ Salah"}</strong>${c?"":"Jawaban yang benar: <b>"+ans+"</b><br>"}<b>Pembahasan:</b> ${e}${note?`<div class="note">${note}</div>`:""}</div>`;
}
$("#next").onclick=()=>{
  if(idx<list.length-1){idx++;render();window.scrollTo(0,0);}else finish();
};
$("#quit").onclick=()=>{if(confirm("Keluar dari kuis? Progres akan hilang."))show("menu");};

function finish(){
  const ok=res.filter(r=>r&&r.c).length,tot=list.length,bad=tot-ok;
  const pct=Math.round(ok/tot*100);
  const by={};list.forEach((d,i)=>{const g=SEC[d.s].g;by[g]=by[g]||{t:0,o:0};by[g].t++;if(res[i]&&res[i].c)by[g].o++;});
  let rows="";Object.keys(by).forEach(g=>{rows+=`<tr><td>${GN[g]}</td><td>${by[g].o}</td><td>${by[g].t-by[g].o}</td><td>${Math.round(by[g].o/by[g].t*100)}%</td></tr>`;});
  const wrong=list.map((d,i)=>({d,i})).filter(x=>!res[x.i]||!res[x.i].c);
  let rev="";
  wrong.forEach(({d,i})=>{
    const r=res[i];
    rev+=`<div class="rev"><span class="tag">${SEC[d.s].n} · Soal ${d.n}</span><div class="qtext" style="font-size:15px">${fmt(d)}</div>`
    +(r?`<div>Jawabanmu: <b style="color:var(--bad)">${L[r.pick]}. ${d.o[r.pick]}</b></div>`:"")
    +`<div>Jawaban benar: <b style="color:var(--ok)">${L[d.a]}. ${d.o[d.a]}</b></div><div style="color:var(--mute);margin-top:4px">${d.e}</div></div>`;
  });
  $("#result").innerHTML=`<div class="hero"><h1>Hasil kuis</h1></div>
  <div class="card"><div class="score">${pct}%</div>
  <p style="margin:8px 0 0"><b style="color:var(--ok)">Benar ${ok}</b> · <b style="color:var(--bad)">Salah ${bad}</b> · Total ${tot} soal</p>
  <table class="tbl"><tr><th>Materi</th><th>Benar</th><th>Salah</th><th>Skor</th></tr>${rows}</table>
  <div class="row"><button class="btn" id="again">Ulangi semua</button>${wrong.length?'<button class="btn alt" id="retry">Ulangi yang salah ('+wrong.length+')</button>':""}<button class="btn alt" id="home">Menu utama</button></div></div>
  ${wrong.length?`<div class="card"><h2 style="font-size:20px">Pembahasan soal yang salah</h2>${rev}</div>`:`<div class="card"><b>Sempurna!</b> Semua jawabanmu benar.</div>`}`;
  show("result");
  $("#again").onclick=()=>begin(list,$("#shuf").checked);
  if($("#retry"))$("#retry").onclick=()=>begin(wrong.map(x=>x.d),false);
  $("#home").onclick=()=>show("menu");
}
</script>
</body>
</html>
